id: aelita
title: Aëlita
author: Alexei Nikolajewitsch Tolstoi
source_path: source/Aelita - Tolstoi - ru.xhtml
source_lang: ru
target_lang: de
ruleset_path: ''
ruleset_apply: false
style_mode: stil-03-branderson
work_dir: work
exports_dir: exports
status_file: status/status.json
log_dir: status/logs
styles_dir: styles
assets_dir: assets
names_file: names.yaml
illustration_setting: Post-revolutionary Soviet Union 1920s and an ancient Mars civilisation. 
  two soviet people and an marsian princess - the marsians are lookling like people but with a very vogelähnlichen gesicht
  Red deserts, canals, vertical cities, winged airships. Atmospheric depth. Marsion
  architecture, alien flora and fauna. 
structure:
  mode: chapter_as_scene
  label: Kapitel als Szenen
  groups: []
display:
  chapters:
    format: source_title
    suffix: ''
    align: center
    include_source_title: true
  scenes:
    show: false
    format: number
    align: center
    page_break: false
    separator: ''
naming_convention:
  style: Deutsche Transliteration russischer Namen nach Duden-Üblichkeit.
  example:
  - Аэлита -> Aëlita
  - Лось -> Los
  - Гусев -> Gussew
  - Тускуб -> Tuskub
  - Марс -> Mars
higgsfield:
  model: text2image_soul_v2
  aspect_ratio: '3:4'
  quality: 1.5k
  moodboard:
    name: Aelite
    style_id: 6fdd3fde-4c0d-4b21-a7fa-cf0f4aa1a7ba
    source: higgsfield generate list --image --size 100 --json
  image_processing:
    format: JPEG
    jpeg_quality: 60
    max_width: 1600
    max_height: 2400
notes: Buchpaket fuer Alexei Tolstoi, Aëlita (Аэлита). EPUB-Quelle (XHTML extrahiert).
  Der Roman gliedert sich in 30 eigenständig betitelte Abschnitte ohne klassische
  Глава-Nummerierung. Die verwendete Textgrundlage beruht auf einer späteren Redaktion
  (1937-1939), nicht auf dem Erstdruck von 1922-1923.
ai_liter:
  default_style: stil-02-poetisch
ai:
  provider: openrouter
  model: deepseek/deepseek-v4-pro
  granularity: scene
  max_tokens_per_scene: 10000
  chunk_char_limit: 12000
