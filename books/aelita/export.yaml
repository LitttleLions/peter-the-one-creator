book:
  title: "Aëlita"
  subtitle: "Ein Mars-Roman zwischen Liebe, Revolution und Untergang"
  author: "Alexei Nikolajewitsch Tolstoi"
  translator: "Motivatier Classics"
  translator_label: "Übersetzung und editorische Einrichtung"
  language: "de"
