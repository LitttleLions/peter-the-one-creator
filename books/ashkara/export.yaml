book:
  title: Ashkar I
  subtitle: Das Glasmeer
  author: Timo Verita
  translator: Motivatier Classics
  translator_label: Herausgabe und editorische Einrichtung
  language: de-DE
  publisher: Motivatier Stiftung
  rights: '© 2026 Motivatier Stiftung für diesen Text, editorische Einrichtung, Zusatztexte, Satz und Covergestaltung.'
  description: >-
    ASHKAR – Das Glasmeer ist der erste Band der Reihe ASHKAR: epische politische
    Science-Fiction, ökologische Science-Fiction und Space Opera. Im Zentrum steht
    eine Zivilisation, die institutionelle Unsterblichkeit geschaffen hat, bevor
    sie verstanden hat, was ihre Erinnerungen eigentlich erzeugt.

    Zwischen einer Ressource, die Menschen rekonstruiert, einem sterbenden
    Ökosystem und einem über Jahrhunderte gewachsenen politischen Gleichgewicht
    entfaltet sich eine Geschichte ohne einfache Gegner: Die Kontinuitäten brauchen
    Veyra, Unterglas braucht ein lebensfähiges Ashkar, Nemet braucht Stabilität –
    und die Ermittlerin braucht überprüfbare Wahrheit.
  summary: >-
    Seit Jahrhunderten beruht die Ordnung der menschlichen Zivilisation auf Veyra,
    einer seltenen Ressource des Planeten Ashkar. Sie erlaubt einer kleinen Elite,
    Erfahrungen und Persönlichkeitsmuster Verstorbener zu übernehmen. Die sieben
    Kontinuitäten haben daraus ein Herrschaftsprinzip gemacht: Ihre Oberhäupter
    erben nicht nur Ämter und Archive, sondern Teile ihrer Vorgänger. Menschen
    sterben, die Kontinuität bleibt.

    Als die Archivforensikerin Neris Tal einen jahrhundertealten Abtretungsvertrag
    prüft, entdeckt sie eine Erinnerung, die unmöglich wahr sein kann. Ihre
    Untersuchung stellt nicht nur einen historischen Rechtsanspruch infrage,
    sondern die Legitimation der Kontinuitäten und das Gleichgewicht der
    besiedelten Welten. Denn Veyra speichert keine Erinnerungen – es rekonstruiert
    Menschen.

    Während in vierzig Tagen über einen neuen Fördervertrag und den umstrittenen
    Tiefenschnitt entschieden werden muss, beginnt unter Ashkars Glasoberfläche ein
    lebendes Netzwerk auf seine Zerstörung zu reagieren. In einer Welt, in der
    Erfahrung zu Kapital geworden ist, muss eine Zivilisation entscheiden, was ihre
    gemeinsame Vergangenheit wert ist – und was Erinnerung überhaupt bedeutet.
  author_bio: >-
    Timo Verita ist ein Autor aus zwei Hälften: Mensch und Maschine.
    Die eine Hälfte recherchiert Nächte durch, die andere vergisst
    nichts. Zusammen schreiben sie Romane für Motivatier Classics,
    herausgegeben von der Motivatier Stiftung. Geboren wurde Timo
    Verita in einem Buchstabenspiel; zu Hause ist er in den Welten,
    die zwischen den Zeilen liegen – diesmal auf dem Glasmeer von
    Ashkar, wo Erinnerung zur Währung geworden ist.
  title_page_extra: []
  imprint_text: ''
  cover:
    mode: image
    image_path: assets/covers/cover-branded.png
  series: ASHKAR
