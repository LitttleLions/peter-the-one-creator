illustration_setting: >-
  High-quality chapter illustration for a literary historical novel set in
  September 1715 on the Baltic coast of Rügen, southern Mönchgut. Style:
  cinematic literary historical illustration, restrained painterly realism,
  fine detail, atmospheric light, emotionally intelligent, premium modern book
  illustration for an ambitious historical adventure and family novel. Setting:
  the lagoon of the Greifswalder Bodden with a shipping barrier of sunken hulls,
  ballast stones and shifting shallow channels; small wooden craft, open fishing
  boats and a gaff-rigged cutter; a low floating work platform with tools and
  timber; thatched and gabled village houses, a small late-medieval church on a
  rise, chalk cliffs, reeds, harbour mud, nets, ropes, casks and salt. Figures in
  plain north German coastal dress of the early eighteenth century: wool coats,
  waistcoats, linen shirts, headscarves, tarred jackets, sturdy boots and bare
  working hands. Light: low September sun, bright haze, metallic grey-green
  water, hard shadows on clear days, sudden squalls and rain drifting over the
  bodden. Colour palette: Baltic grey and green, chalk white, wet sand, tar
  black, weathered ochre and dark red, muted blue, brass and pale gold light.
  Mood: grave, taut, human and concrete, with work, family, obligation and quiet
  danger rather than heroic spectacle; figures small against water and weather,
  close attention to hands, faces and boats. Clear central figure or central
  dramatic situation, strong readable composition.
