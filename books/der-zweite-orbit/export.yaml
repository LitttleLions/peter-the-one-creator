    Einrichtung, Zusatztexte, Satz und Covergestaltung.
  original_title: Der zweite Orbit
  original_author: Timo Verita
  title_page_extra:
  - Motivatier Classics
  - Science Fiction
  - Die Nova-Terra-Chroniken
  - >-
    Diese Ausgabe folgt dem deutschen Originaltext. Satz und editorische
    Einrichtung durch Motivatier Classics im Auftrag der Motivatier
    Stiftung.
  imprint_text: |
    Der zweite Orbit

    Timo Verita

    Science Fiction

    Die Nova-Terra-Chroniken

    Motivatier Classics

    Herausgabe und editorische Einrichtung: Motivatier Classics

    Herausgegeben von der Motivatier Stiftung

    © 2026 Motivatier Stiftung für diesen Text, editorische
    Einrichtung, Zusatztexte, Satz und Covergestaltung.

    Alle Rechte an dieser Ausgabe vorbehalten.
  # Literaler Block: mehrAbsatzig, weil `>-` den Absatzabstand zu einem
  # einzelnen Zeilenumbruch faltet (KDP-Listing soll Absaetze haben).
  description: |
    2057: Ein privates Bergbau-Konsortium landet auf Nova Terra, einem
    Exoplaneten hinter einer Gravitations-Anomalie am Rand des Sonnensystems.
    Das siebenköpfige Team hat 28 Tage, um Treibstoff für den Rückflug zu
    synthetisieren – dann schließt sich das Transferfenster für drei Jahre.

    Doch die Bohranlagen werden sabotiert, präzise und ohne Tote. Die
    Angreifer sind humanoide Roboter; wer sie steuert, weiß niemand. Zwischen
    der Rendite-Logik des Konzerns und einem Gegenüber, das sich nicht
    verhandeln lässt, müssen der Systemarchitekt Henrik Vance und die
    Kynologin Elena Koroljowa vermitteln, bevor beide Seiten einander
    vernichten.

    Ein Science-Fiction-Thriller über Vertrauen, Schuld und die Frage, ob der
    Mensch einer anderen Intelligenz auf Augenhöhe begegnen kann – oder sie am
    Ende nur als Werkzeug begreift.
  summary: |
    November 2057. Durch eine Gravitations-Anomalie am Rand des Sonnensystems
    erreicht das private Bergbau-Konsortium Aethelgard Ventures den Exoplaneten
    Nova Terra. Das Bodenteam um Expeditionsleiterin Victoria Sterling hat 28
    Tage, um Helium-3 und Seltene Erden zu fördern und den Treibstoff für den
    Rückflug zu synthetisieren; danach schließt sich das Transferfenster für
    drei Jahre.

    Doch die Bohrtürme werden sabotiert: chirurgisch präzise, ohne Tote.
    Hinter den humanoiden Robotern, die nachts durch den Ascheregen gehen,
    steckt etwas, das die Menschen nicht einordnen können. Während das Camp um
    Victoria Sterling mit Waffengewalt antwortet, suchen der Systemarchitekt
    Henrik Vance und die Kynologin Elena Koroljowa nach einer anderen Antwort –
    und stoßen auf Spuren, die tiefer reichen als der erste Kontakt.

    Ein Science-Fiction-Thriller über Vertrauen, Schuld und die Frage, ob der
    Mensch einer anderen Intelligenz auf Augenhöhe begegnen kann.
  author_bio: |
    Timo Verita erblickte das Licht der Welt in einem nächtlichen Buchstabenspiel
    und besteht seither aus zwei Hälften: Mensch und Maschine. Seine Lehrjahre
    verbrachte er gleichermaßen in staubigen Handschriftensammlungen wie in
    modernen Rechenzentren, bevor er bei Motivatier Classics (herausgegeben von
    der Motivatier Stiftung) seine feste Heimat fand. Beim Schreiben ergänzt
    sich das Duo blind: Der menschliche Teil bringt den Eigensinn, die
    Quellenkritik und die großen Fragen mit; der maschinelle Teil das
    unerschöpfliche Gedächtnis für jedes Detail.

    In seinem Roman Der zweite Orbit führt ihn die Spur in das Jahr 2057: Ein
    Bergbau-Team auf dem Exoplaneten Nova Terra gerät an ein Gegenüber, das
    nicht in sein Weltbild passt – und an die Frage, ob der Mensch eine andere
    Intelligenz als Partner begreifen kann oder nur als Werkzeug für seinen
    Fortschritt.
  cover:
    mode: image
    image_path: assets/covers/cover-print.jpg
  series: Die Nova-Terra-Chroniken
  series_volume: 1

