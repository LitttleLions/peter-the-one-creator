book:
  title: Der zweite Orbit
  subtitle: Ein Nova-Terra-Roman
  author: Timo Verita
  translator: Motivatier Classics
  translator_label: Herausgabe und editorische Einrichtung
  language: de-DE
  publisher: Motivatier Stiftung
  editor: Motivatier Classics
  rights: >-
