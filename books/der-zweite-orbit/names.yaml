  rf_uid: c9610b1b-e046-45fe-9b89-14f707a7893f
  rf_appearance_sha: ce82185d14f972c40b342bd7f76e06778754792b65200253ca6edea6b1903d77
  note: 'RomanForge-Rolle: Hauptfigur – Kynologin, Bio-Scouting-Spezialistin und Hundeführerin
    im Basiscamp'
  visual: 33 Jahre alt, mittelgroß, drahtig und durchtrainiert mit einem federnden,
    lautlosen Gang. Ovales Gesicht mit hohen Wangenknochen, wettergegerbter heller
    Haut, wachen bernsteinfarbenen Augen und langem, dunkelbraunem Haar, das sie streng
    zu einem tiefen Zopf im Nacken bindet. Sie trägt einen schlammverkrusteten, olivgrünen
    Outdoor-Overall mit verstärkten Knien, eine taktische Hundeführerweste mit Signalpfeifen
    und Biometrie-Empfängern sowie schwere Schnürstiefel. Eine feine, weiße Bissnarbe
    zieht sich über ihr rechtes Handgelenk.
- source: Lin Chen
  target: Lin Chen
  aliases: []
  type: person
  status: draft
  rf_uid: cf9bc951-6bf7-496e-bd17-3437a0d37e11
  rf_appearance_sha: 215743a4cc2a9466a9ab129314ebebf4705b664675e6f5b9055b077de3824ba4
  note: 'RomanForge-Rolle: Nebenfigur – Camp-Ärztin und Umwelt-Biologin in Outpost
    Alpha'
  visual: 38 Jahre alt, zierlich, aber zäh gebaut, mit ruhigen, fließenden Handbewegungen.
    Schmales Gesicht mit glatter, blasser Haut, wachen dunklen Augen hinter einer
    dünnen, randlosen Datenbrille und kinnlangem, glattem schwarzem Haar, das sie
    unter einer weißen OP-Haube oder einem Stirnband trägt. Trägt einen sauberen,
    hellgrauen Mediziner-Overall mit rot abgesetzten Schulterstreifen und ein tragbares
    Biometrie-Tablet an einer Magnethalterung vor der Brust.
