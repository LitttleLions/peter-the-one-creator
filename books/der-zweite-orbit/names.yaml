  rf_uid: 738ee8e1-4af6-4430-8630-56635a3c30a0
  rf_appearance_sha: 29549fef4d89c6cf8205753a6212e9ada741c135bcf504fa02006b2916cdb29b
  note: 'RomanForge-Rolle: Nebenfigur – Chef-Geologe und Leiter der automatisierten
    Sinter-Bohrungen im Camp'
  visual: 39 Jahre alt, untersetzt, stämmig mit breiten Händen und kurzen, kräftigen
    Armen. Rundes, oft verschwitztes Gesicht mit rötlichem Vollbart, kleiner Knollennase,
    müden braunen Augen mit dunklen Ringen und schütterem rotem Haar unter einer abgetragenen
    Wollmütze. Trägt einen schweren, gelb-schwarzen Exoskelett-Stützgurt über seinem
    verdreckten Mechaniker-Overall sowie schwere Stahlkappen-Stiefel.
- source: Maljutka
  target: Maljutka
  aliases: []
  type: person
  status: draft
  rf_uid: 8425187f-a79e-4f46-91b4-eeeb9a1785c6
  rf_appearance_sha: d8885962d7187ea37cebb41d2db3ba9006fa85aeeacc4f9f210e353f5dd42a72
  note: 'RomanForge-Rolle: Nebenfigur – Älteste Archivarin und Hüterin des Sputnik-Heiligtums
    unter den Laika-Nachfahren'
  visual: Vierzehn Jahre alte, kleine, zierliche Hündin (ca. 14 kg, im Aussehen fast
    ein exaktes Abbild der historischen Laika von 1957) mit weiß-cremefarbenem Fell,
    dunkelbraunen Ohren und einer fast völlig ergrauten Schnauze. Ihre Augen sind
    von leichtem Altersstar milchig getrübt, blicken aber ruhig und durchdringend;
    um ihren Hals sitzt ein besonders fein ziselierter, silbrig schimmernder Neural-Kragen
    der ersten Alien-Generation. Wegen altersbedingt schwacher Gelenke nutzt sie keinen
    großen zweibeinigen Roboter-Avatar, sondern bewegt sich auf vier Pfoten oder einer
    schwebenden Repulsor-Trageplatte.
- source: Oktjabr
  target: Oktjabr
  aliases: []
  type: person
  status: draft
  rf_uid: 8d4de9d7-08c3-4981-bef2-6f3d9dcf434d
