  note: 'RomanForge-Rolle: Gegenspieler – Vorstandsbeauftragter und Aufsichtsrats-Vertreter
    auf dem Mutterschiff im Orbit'
  visual: 56 Jahre alt, hochgewachsen, schlank, mit makellos gepflegtem Äußeren in
    der Schwerelosigkeit bzw. im Rotations-Habitat des Mutterschiffs. Scharfes, schmales
    Gesicht mit hoher Stirn, eisgrauen Augen, zurückgegeltem silberweißem Haar und
    einem exakt gestutzten schmalen Oberlippen- und Kinnbart. Trägt auch an Bord des
    Trägerschiffs einen maßgeschneiderten anthrazitfarbenen Business-Stehkragenanzug
    mit magnetischen Sohlen.
- source: Marcus Thorne
  target: Marcus Thorne
  aliases: []
  type: person
  status: draft
  rf_uid: 35fbe977-bb38-4366-acbf-fc41ad56ff81
  rf_appearance_sha: ae193b0bfffa43b126facbeefe35569b4b6854285d20657937e5bf695b1fe92f
  note: 'RomanForge-Rolle: Nebenfigur – Leiter der Camp-Sicherheit und verantwortlicher
    Taktiker vor Ort'
  visual: 51 Jahre alt, breitschultrig, kompakt und muskulös wie ein ehemaliger Rugbyspieler,
    mit ruhigen, sparsamen Bewegungen. Kantiges Gesicht mit gebrochener Nase, dunkler
    Haut, kurz geschorenem schwarzem Haar mit grauen Schläfen und wachsamen dunkelbraunen
    Augen. Trägt eine matte, anthrazitfarbene ballistische Schutzweste über dem grauen
    Stations-Overall, ein schweres Mehrzweck-Werkzeugmesser am Oberschenkel und ein
    Kehlkopfmikrofon.
- source: Henrik Vance
  target: Henrik Vance
  aliases: []
  type: person
  status: draft
  rf_uid: 373a7f0d-d127-4764-9564-0983ff837ab6
  rf_appearance_sha: cc48daafeadaee763f205b5836803ad16a4515f910461f85184a85b0824574e6
  note: 'RomanForge-Rolle: Hauptfigur – Leitender Systemarchitekt und Robotik-Diagnostiker
    der Nova-Terra-Mission'
  visual: 47 Jahre alt, hochgewachsen und hager, mit leicht nach vorn geneigten Schultern.
    Er hat schmale, markante Gesichtszüge mit tiefen Falten um die graublauen Augen,
    kurz geschorenes dunkelblondes Haar mit deutlichen silbernen Schläfen und einen
    unregelmäßig gestutzten Dreitagebart. Er trägt meist eine abgewetzte, dunkelgraue
    Thermo-Arbeitsweste mit vielen Werkzeugtaschen über einem verwaschenen blauen
    Rollkragenshirt, ölverschmierte Arbeitshandschuhe am Gürtel sowie eine auffällige
    blasse Brandnarbe quer über dem linken Handrücken.
- source: Boran
  target: Boran
  aliases: []
  type: person
