  rf_uid: 3af01348-99ef-4aa4-8b19-35a73076b6fd
  rf_appearance_sha: 14de934a3e1176f7e303cc18f2fbc3c2cf3433add3525752b44bd9b6c2338c3e
  note: 'RomanForge-Rolle: Nebenfigur – Ausgebildeter Erden-Spürhund im Camp und biologischer
    Brückenbauer'
  visual: Sechs Jahre alter, kräftiger Rüde (ca. 34 kg) mit dichtem, wolfsartigem,
    dunkelgrauem und schwarzem Stockhaar, breiter Brust und aufrecht stehenden, spitzen
    Ohren. Um die Schnauze zeigen sich erste graue Haare, und über dem linken Auge
    befindet sich eine kleine, verheilte Kerbe im Fell. Im Außeneinsatz trägt er ein
    leuchtend orangefarbenes Biometrie-Geschirr mit kleiner Helmkamera, GPS-Bake und
    Vital-Sensoren am Brustkorb.
- source: Soren Halvorsen
  target: Soren Halvorsen
  aliases: []
