  note: 'RomanForge-Rolle: Gegenspieler – Expeditionsleiterin und Venture-Direktorin
    der Aethelgard-Mission im Camp'
  visual: 44 Jahre alt, mittelgroß, schlank, mit kerzengerader, fast militärisch kontrollierter
    Körperhaltung. Scharf geschnittenes Gesicht mit hohen Brauen, kühlen grünen Augen
    und einem schmalen Mund, platinblondes Haar in einem exakt kinnlangen Bob, der
    selbst im staubigen Camp immer makellos sitzt. Trägt maßgeschneiderte, dunkelblaue
    Funktionskleidung aus sauberem High-Tech-Gewebe mit dem dezenten silbernen Aethelgard-Emblem
    auf der Brust und ein dünnes Daten-Armband am linken Handgelenk.
- source: Vostok
  target: Vostok
  aliases: []
  type: person
  status: draft
  rf_uid: 1a1fcbf4-60ab-49e9-a0bd-9469942ed37c
  rf_appearance_sha: 5cb053124c66af1ab8b86f7700f298d4976a896319d56af2d6559eb217c4e571
  note: 'RomanForge-Rolle: Nebenfigur – Leitender Techniker und Schwarm-Koordinator
    der Laika-Nachfahren'
  visual: Im biologischen Körper ein mittelgroßer, drahtiger Rüde (ca. 20 kg) mit
    kurzhaarigem, schwarz-lohfarbenem Fell, hellen Abzeichen über den Augen und einem
    schmalen, kupferfarben schimmernden Neural-Kragen. Sein gesteuerter Roboter-Avatar
    ist ein leicht modifizierter, 1,90 Meter großer Wartungs-Avatar mit vier zusätzlichen
    feinmechanischen Werkzeug-Armen am Brustkorb (sechsarmig) und bläulich leuchtenden
    Diagnose-Optiken.
- source: Kudrjawka-Sieben
  target: Kudrjawka-Sieben
  aliases: []
  type: person
  status: draft
  rf_uid: 1ab67a11-cf4e-4bce-8195-684c382251f1
  rf_appearance_sha: c1eba8ccb3a975bb62c924f6826c573a2a89b2fc7d59facf33345d602c934355
  note: 'RomanForge-Rolle: Hauptfigur – Grenzgänger und Späher der Laika-Nachfahren,
    erster Kontaktpartner der Menschen'
  visual: Im realen biologischen Körper ein mittelgroßer, kräftiger Mischlingshund
    (ca. 22 kg, Züge von sibirischem Husky und Terrier) mit dichtem, grau-weiß-schwarz
    geflecktem Fell, buschigem, geringeltem Schwanz, klaren bernsteinbraunen Augen
    sowie einem nahtlos eingewachsenen, mattschwarzen bio-kybernetischen Neural-Kragen
    mit bläulichen Lichtleiter-Adern entlang des Hinterkopfs und der Halswirbelsäule.
    Sein gesteuerter Roboter-Avatar ist eine zwei Meter große, schlanke, zweibeinige
    Maschine aus verwittertem, titanfarbenem Verbundstoff mit viergliedrigen Greifhänden,
    nach hinten gewinkelten Laufgelenken und einem gesichtslosen, ovalen Sensorkopf.
- source: Jannis Koster
  target: Jannis Koster
  aliases: []
  type: person
  status: draft
  rf_uid: 27531688-a7ad-4fd8-a832-fbf100983b6f
