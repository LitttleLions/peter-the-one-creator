  status: draft
  rf_uid: 5ecc638f-aa3b-4789-b37c-0943dd5a8f6c
  rf_appearance_sha: ba5777a413b39a36b6fb1ac7e449a7b47b906b8fae9208f1f2e1e85afbc7908c
  note: 'RomanForge-Rolle: Nebenfigur – Kommandant des Orbital-Trägers Aethelgard
    Prime'
  visual: 60 Jahre alt, schwer gebaut, mit breitem Nacken und ruhiger, aufrechter
    Haltung auf dem Kommandodeck. Wettergegerbtes, kantiges Gesicht mit tiefen Furchen,
    grauem kurzem Vollbart, buschigen Brauen über blauen Augen und lichtem grauem
    Haar. Trägt die dunkelblaue Standard-Flottenuniform mit goldenen Kapitänsstreifen
    und magnetischen Stiefeln.
