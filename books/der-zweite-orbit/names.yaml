  note: 'RomanForge-Rolle: Gegenspieler – Anführer der Wächter-Fraktion unter den
    Laika-Nachfahren (Hardliner)'
  visual: Im biologischen Körper ein großer, schwer gebauter Rüde (ca. 30 kg) mit
    überwiegend schwarzem und rostbraunem Fell, einem vernarbten linken Ohr und einem
    kalt glänzenden, breiten kybernetischen Neural-Kranz am Schädel, dessen Status-Leuchten
    bernsteinfarben pulsieren. Sein gesteuerter Roboter-Avatar („Der schwere Wächter“)
    ist eine 2,30 Meter hohe, massige Industrie- und Schutzmaschine mit dunkelgrauer
    Keramik-Panzerung, hydraulischen Brechwerkzeugen anstelle feiner Finger und drei
    rot leuchtenden optischen Linsen im breiten Brust-Kopf-Segment.
- source: Taiga
  target: Taiga
  aliases: []
  type: person
  status: draft
  rf_uid: b547d2ae-8a12-46ef-ab81-d330201c52bf
  rf_appearance_sha: 4fb02eccd7085dacfd8201fa5ed3980ab6ae4367fbb7596d94c184476396f825
  note: 'RomanForge-Rolle: Nebenfigur – Jüngere Erden-Schutzhündin im Camp und Spurensucherin'
  visual: Drei Jahre alte, mittelgroße, sehnige Hündin (ca. 26 kg) mit kurzem, dichtem,
    sandfarben-rötlichem Fell, schwarzer Gesichtsmaske und einer buschigen, sichelförmig
    über den Rücken getragenen Rute. Wache, dunkelbraune Augen und ein charakteristisches
    Knickohr rechts. Trägt im Einsatz ein neongelbes Biometrie-Geschirr mit seitlichen
    Packtaschen für Notfall-Signalstäbe.
