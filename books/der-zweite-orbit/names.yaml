  note: 'RomanForge-Rolle: Nebenfigur – Landefähren-Pilot, Logistiker und Funk-Operator
    im Camp'
  visual: 34 Jahre alt, mittelgroß, schlaksig mit langen Fingern und unruhiger Körperhaltung.
    Schmale Nase, blasse Haut mit Sommersprossen, wasserblaue, oft nervös blinzelnde
    Augen und kurz geschnittenes, strohblondes Haar. Trägt eine gepolsterte, dunkelgrüne
    Fliegerjacke mit abgewetzten Lederbündchen über dem grauen Bord-Overall und ein
    schweres Funk-Headset um den Hals.
- source: Iskra
  target: Iskra
  aliases: []
  type: person
  status: draft
  rf_uid: 2d4d2386-2043-42fc-9f10-f7c68ac76f4a
  rf_appearance_sha: e9b41ca8adf772cabb7bd05f38a77070a29d5eeeae8cb25fd3cb2c495fd224c8
  note: 'RomanForge-Rolle: Nebenfigur – Junge Späher-Hündin der Laika-Nachfahren ohne
    großen Avatar'
  visual: Anderthalb Jahre alte, kleine, wendige Hündin (ca. 15 kg) mit dichtem, weiß-rotbraun
    geschecktem Fell, spitzer Schnauze, leuchtend dunklen Knopfaugen und einer buschigen
    Rute mit weißer Spitze. Trägt keinen massiven Schädelkranz, sondern nur ein schmales,
    kaum sichtbares anthrazitfarbenes Kontaktband im Nackenfell.
- source: Anton Lindqvist
  target: Anton Lindqvist
  aliases: []
  type: person
