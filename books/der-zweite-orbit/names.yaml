  note: 'RomanForge-Rolle: Historische Schlüsselfigur und mythologische Urmutter der
    Hunde-Zivilisation auf Nova Terra'
  visual: Historisch kleine, zierliche Hündin (deren optisches Abbild sich in der
    Archivarin Maljutka mit weiß-cremefarbenem Fell und dunkelbraunen Ohren widerspiegelt).
- source: Elena Koroljowa
  target: Elena Koroljowa
  aliases: []
