# Stilanker: Stil, Licht, Palette, Stimmung. Bewusst OHNE Ortskatalog - die
# Kulisse eines Kapitels kommt aus der Vignette (work/prompts/higgsfield/
# vignettes/). Ein Orts- und Wetterkatalog an dieser Stelle machte alle
# Kapitelbilder fast identisch (docs/offene-punkte.md Punkt 14).
illustration_setting: >-
  Cinematic literary historical illustration, restrained painterly realism, fine
  detail, atmospheric light. Mid-9th century Carolingian winter: cold grey-blue
  daylight, wet slate grey, mud brown, oak dark, iron black, snow white, dull
  ochre and dark red, pale gold firelight. Mood: grave, taut, human and
  concrete, with work, family, obligation and quiet danger rather than heroic
  spectacle. Clear central figure or central dramatic situation, strong
  readable composition.
# Material- und Epochenvokabular: was in dieser Welt existiert, nicht was auf
# jedem Bild zu sehen sein soll.
illustration_world: >-
  Early medieval Frankish material world: wool, linen and leather clothing,
  felt caps, mail and conical helmets, wax tablets, parchment and calfskin
  deeds with wax seals, oak, tarred rope, iron.
higgsfield:
  model: gpt_image_2_5
  aspect_ratio: "3:4"
  quality: 1k
  render_quality: medium
  vignette:
    provider: auto
    model: google/gemini-2.5-flash-lite
  image_processing:
    format: JPEG
    jpeg_quality: 60
    max_width: 1024
    max_height: 1024
    cover:
      jpeg_quality: 75
      max_width: 1600
      max_height: 2400
notes: Deutsches Original aus RomanForge (Stufe 1).
ai:
  provider: openrouter
  model: deepseek/deepseek-v4-pro
  granularity: scene
  max_tokens_per_scene: 10000
