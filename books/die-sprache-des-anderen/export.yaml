  imprint_text: |
    Die Sprache des Anderen

    Timo Verita

    Historischer Roman

    Straßburg · Zaberner Steige · Lothringen · Maas · 9. Jahrhundert

    Motivatier Classics

    Herausgabe und editorische Einrichtung: Motivatier Classics

    Herausgegeben von der Motivatier Stiftung

    © 2026 Motivatier Stiftung für diesen Text, editorische
    Einrichtung, Zusatztexte, Satz und Covergestaltung.

    Alle Rechte an dieser Ausgabe vorbehalten.
  description: >-
    Zwei Könige stehen vor Straßburg, und dazwischen liegt eine Frau mit fünf
    Kähnen. Alda führt den Fuhrbetrieb ihres verstorbenen Mannes weiter – und
    schuldet dem Grundherrn Raginbert dreißig Pfund Silber, fällig am
    Martinstag. Bis dahin will er Schiff und Vieh, bis dahin will er ihr Haus.

    Doch Raginbert ist nur die Hand, die das Unrecht vollzieht. Die eigentliche
    Macht liegt beim Wort: in der lateinischen Urkunde, die Alda nicht lesen
    kann, im Bannrecht des Heerbanns, in Listen, die über ihr Leben verfügen.
    Um zu überleben, braucht sie genau das, was ihr fehlt – einen Schreiber, einen
    Weg über die Zaberner Steige, ein Bündnis der Fuhrleute und einen Handel,
    der größer ist als die Schulden.

    Ein historischer Roman über Arbeit und Schulden im 9. Jahrhundert, über die
    Sprache der Herrschenden und die stille Sprache derer, die sie nicht
    beherrschen – und über einen Jungen, der lesen lernt, weil seine Mutter den
    Preis dafür bezahlt hat.
  summary: >-
    Winter, als zwei Könige vor Straßburg standen: Der eine zieht aus dem Osten
    heran, der andere aus dem Westen, und zwischen ihnen liegt eine Stadt, die
    beiden nichts geben will. Alda führt den Fuhrbetrieb ihres verstorbenen
    Mannes Heinrich: fünf Kähne auf der Ill, zwanzig Karren, Getreide aus dem
    Kochersberg, Bauholz aus den Vogesenwäldern, Weizen für die Klöster. Dann
    verpfändet Raginbert, der Grundherr im Dienst des westfränkischen Königs, die
    Kähne, beschlagnahmt das Vieh und macht die Schulden des Toten zu einem
    Strick um ihren Hals.

    Alda hat Zeit, das Geschriebene zu umgehen, aber nicht die Kraft, es zu
    lesen. Um die dreißig Pfund Silber zu beschaffen und einen Salztransport
    über die Zaberner Steige nach Lothringen zu bringen, braucht sie genau das,
    was ihr fehlt – einen Schreiber, einen Weg durch das Heer der Könige, ein
    Bündnis der Fuhrleute und einen Handel, der größer ist als die Schulden. Der
    Schreiber Otwin kennt die Zölle, die Wege und die Schrift, in der Macht
    geschrieben wird; ihr Sohn Berto kennt nichts als die Kälte und die Frage,
    warum die Herren lesen dürfen und er nicht.

    Am Ende steht kein Sieg, sondern eine Wende: Das Reich zerfällt in drei, und
    eine Frau, die nicht lesen kann, erkennt, dass ihr Sohn lesen muss. Der Roman
    erzählt von einer Generation, die den Übergang von der mündlichen zur
    schriftlichen Ordnung erlebt – und von der Frage, wem die Sprache des
    Anderen gehört, wenn die eigene einem die Freiheit kostet.
  author_bio: |
    Timo Verita erblickte das Licht der Welt in einem nächtlichen Buchstabenspiel
    und besteht seither aus zwei Hälften: Mensch und Maschine. Seine Lehrjahre
    verbrachte er gleichermaßen in staubigen Handschriftensammlungen wie in
    modernen Rechenzentren, bevor er bei Motivatier Classics (herausgegeben von
    der Motivatier Stiftung) seine feste Heimat fand. Beim Schreiben historischer
    Romane ergänzt sich das Duo blind: Der menschliche Teil bringt den Eigensinn,
    die Quellenkritik und die großen Fragen mit; der maschinelle Teil das
    unerschöpfliche Gedächtnis für jedes Detail vergangener Jahrhunderte.

    In seinem aktuellen Roman der Reihe Zwischen Rhein und Maas folgt er dem
    Leitsatz, dass politische Grenzen schneller wandern als die Verbindungen der
    Menschen – diesmal im Jahr 842 zwischen Straßburg und Verdun.
