  rf_appearance_sha: de9dd492f32bef0de84a4ab9ca16815ec2015a70b7ca002c6a27395ec11fa1e8
  note: 'RomanForge-Rolle: Scharfsinnige Straßburger Abgabenkundige und Rechtsberaterin
    der Kaufleute'
  visual: Frau, 52 Jahre, mittelgroß, kerzengerade Haltung. Helles, flachsblondes
    Haar unter schlichtem Leinentuch, hohe Stirn, wache wasserblaue Augen. Gepflegtes
    dunkelblaues Wollkleid, Lederschürze, Kerbhölzer am Gürtel.
