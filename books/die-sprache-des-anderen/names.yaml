entries:
- source: Alda
  target: Alda
  aliases:
  - Frau Alda
  - Witwe Alda
  type: person
  status: draft
  note: Witwe und Inhaberin eines Fuhrbetriebs mit fünf Kähnen auf der Ill in Straßburg;
    handelt mit Fürsten, Grafen und Heerbann.
  visual: 40-jährige Frau, kräftig und wetterhart, dunkles Haar unter grober Wollkappe,
    gefettete Rindslederstiefel, fleckiger Wollmantel mit Schafsfellfutter, aufmerksamer
    und zäher Blick, kräftige Hände
  rf_uid: 79c3f990-211c-4c27-b8c2-c84bc550cecc
  rf_appearance_sha: 12d4e672f2503a8751fbe5301ba6329633745f48006114aeac527bb0c79479bb
- source: Berto der Knecht
  target: Berto
  visual_label: Berto der Knecht
  aliases:
  - der alte Knecht
  - der alte Berto
  type: person
  status: draft
  note: Alter Knecht und Fuhrmann auf Aldas Kähnen, hinkt seit einem Eiswinter.
  visual: 60-jähriger Knecht, gebückt und hinkend, strubbeliges Grauhaar, zerschlissene
    Kappe, grobe Holzschuhe mit Stroh, wettergegerbtes Gesicht
  rf_uid: 317d35b8-4984-4b85-a254-de99ef8e0529
  rf_appearance_sha: e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855
- source: Raginbert
  target: Raginbert
  aliases:
  - Herr Raginbert
  - Graf Raginbert
  type: person
  status: draft
  note: Der Grundherr, der im Namen des westfränkischen Königs die Versorgung des
    linken Rheinufeers sichert; verhaengt ein Haus ueber Aldas Kopf.
  visual: 50-jähriger geistlicher Grundherr, glatt rasiert, volle von Kaelte geroetete
    Wangen, wässrig graue Augen, schwerer blauer Mantel mit Fuchspelzfutter, Silberbeschlaege
    an der Zaumzeug, kalter Blick
  rf_uid: 30f7481b-c969-4d1f-96c1-8c2ecc1c2873
  rf_appearance_sha: e1c6608b417e4ac663bf6cb2cd14564eb91474cb5f08cceb981af82752ac91a0
- source: Isenbart
  target: Isenbart
  aliases:
  - Vogt Isenbart
  type: person
  status: draft
  note: Vogt des Grundherrn Raginbert; trägt die Forderung aus dem gesiegelten Kalbsleder
    vor und pfändet Aldas Zugrosse (Kapitel 001). Kein RomanForge-Eintrag.
  visual: Schmaler, gepflegter Vogt um die fünfzig, dunkelblauer Wollmantel mit Marderfell,
    schmales Holzstäbchen in der Hand, sorgfältig gekämmtes Haar, kalter Blick
- source: Folker
  target: Folker
  aliases: []
  type: person
  status: draft
  note: Aldas Verwalter und Gläubiger, der das Haus ueber dem Kopf zerstoeren will;
    riecht nach Zwiebeln und ranzigem Speck.
  visual: 45-jähriger Verwalter, ungepflegt, Bartstoppeln, fleckige Gewandstuecke,
    aufgeschlagenes Schafsfell, zaehneknirschende Miene, fette Finger
  rf_uid: 1e510ae0-927e-4275-a2f1-ba83b7488819
  rf_appearance_sha: e15fcd354804cfa877f9d3ddd3624158f57f348c7d7a8e8fc065d3fc58932682
- source: Otwin
  target: Otwin
  aliases: []
  type: person
  status: draft
  note: Kranker junger Schreiber im Dienst Raginberts, von Schuld und Krankheit gezeichnet,
    verkauft sein Wissen ueber ein Geleit nach Lothringen.
  visual: 25-jähriger blasser Schreiber, eingefallene Wangen, fiebrige unstete Augen,
    fransige Kapuze, klamme Finger um Feder und Pergament, schwere Schultern unter
    dem Reiterrock
  rf_uid: d29f717a-1565-4188-9b25-b97905180f1e
