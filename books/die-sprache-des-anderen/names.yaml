entries:
- source: Alda
  target: Alda
  aliases:
  - Frau Alda
  - Witwe Alda
  type: person
  status: draft
  note: Witwe und Inhaberin eines Fuhrbetriebs mit fünf Kähnen auf der Ill in Straßburg;
    handelt mit Fürsten, Grafen und Heerbann.
  visual: Etwa 32 Jahre alt, sehnige, kräftige Statur,  Dunkelblondes, meist straff
    zurückgebundenes Haar, markante Wangenknochen, wache graubraune Augen mit frühem
    Ernst in den Mundwinkeln. Ihre Hände sind schmal, aber von harter Arbeit an Tauen,
    Holz und Zügeln kräftig und an den Handflächen leicht verschwielt.
  rf_uid: 79c3f990-211c-4c27-b8c2-c84bc550cecc
  rf_appearance_sha: cdf535336667c80762e0e9015f81e2157b6c1429c36c8e5a26943fc960be38bc
- source: Berto der Knecht
  target: Berto
  visual_label: Berto der Knecht
  aliases:
  - der alte Knecht
  - der alte Berto
  type: person
  status: draft
  note: Alter Knecht und Fuhrmann auf Aldas Kähnen, hinkt seit einem Eiswinter.
  visual: Mann, 55 Jahre, gedrungene, krummrückige Gestalt, breiter Nacken. Tief zerfurchtes,
    wettergegerbtes Gesicht, schütteres graues Haar, verfilzter Vollbart, grobe Hände.
    Einfacher brauner Arbeitskittel, grobe Lederweste.
  rf_uid: 317d35b8-4984-4b85-a254-de99ef8e0529
  rf_appearance_sha: 8e5f2b380b38ec853069b0b617da40997e4e91ca4ce4b7723c87839000c079ef
- source: Raginbert
  target: Raginbert
  aliases:
  - Herr Raginbert
  - Graf Raginbert
  type: person
  status: draft
  note: Der Grundherr, der im Namen des westfränkischen Königs die Versorgung des
    linken Rheinufeers sichert; verhaengt ein Haus ueber Aldas Kopf.
  visual: Mann, 50 Jahre, hochgewachsen, breitschultrig. Wettergegerbtes, glattrasiertes
    Gesicht, kalte graue Augen, volles stahlgraues Haar. Edler frühmittelalterlicher
    Pelzmantel über feinem blauen Wollgewand, Kettenhemd-Ansatz, Schwert am Gürtel.
  rf_uid: 30f7481b-c969-4d1f-96c1-8c2ecc1c2873
  rf_appearance_sha: b7ccd9c685fd45b1724b5c6fc19e355dbed3997aab2764b57a2bfe592574e5ed
- source: Isenbart
  target: Isenbart
  aliases:
  - Vogt Isenbart
  type: person
  status: draft
  note: Vogt des Grundherrn Raginbert; trägt die Forderung aus dem gesiegelten Kalbsleder
    vor und pfändet Aldas Zugrosse (Kapitel 001). Kein RomanForge-Eintrag.
  visual: Schmaler, gepflegter Vogt um die fünfzig, dunkelblauer Wollmantel mit Marderfell,
    schmales Holzstäbchen in der Hand, sorgfältig gekämmtes Haar, kalter Blick
- source: Adalhard
  target: Adalhard
  visual_label: Graf Adalhard
  aliases:
  - Graf Adalhard
  - Adelhardt
  type: person
  status: draft
  note: Graf und Vorsitzender des Placitum in Straßburg; setzt in Kapitel 003 die Frist
    bis Martini und spricht in 031 das Grafengericht. Kein RomanForge-Eintrag, von
    Hand angelegt (Schreibweise im Roman "Adalhard").
  visual: Mann mit wettergegerbtem Gesicht, kurz geschorenem grauem Haar und dichtem
    grauem Bart, gehüllt in einen Biberpelz mit schlammgeflecktem Saum
- source: Folker
  target: Folker
  aliases: []
  type: person
  status: draft
  note: Aldas Verwalter und Gläubiger, der das Haus ueber dem Kopf zerstoeren will;
    riecht nach Zwiebeln und ranzigem Speck.
  visual: Mann, 45 Jahre, untersetzt, fleischige Statur, schwerer Nacken. Glattes,
    gerötetes Gesicht, schmale Lippen, kurz gestutzter dunkler Bart, kalte Augen.
    Feiner dunkelblauer Tuchmantel mit Marderfellkragen und Fellmütze.
  rf_uid: 1e510ae0-927e-4275-a2f1-ba83b7488819
  rf_appearance_sha: e86603e474b95d1cd85d5586437abdb2c011170566c9ba9fdf2307ea131afa03
- source: Otwin
  target: Otwin
  aliases: []
  type: person
  status: draft
  note: Kranker junger Schreiber im Dienst Raginberts, von Schuld und Krankheit gezeichnet,
    verkauft sein Wissen ueber ein Geleit nach Lothringen.
  visual: Mann, 29 Jahre, schmale, leicht gebeugte Statur. Blasses, schmales Gesicht,
    dunkle unruhige Augen, herauswachsende Mönchstonsur im dunkelbraunen Haar. Tintenflecken
    an den Fingern, blasse Brandnarbe auf dem linken Handrücken. Abgetragene dunkle
    Klerikerkutte, hölzernes Schreibfutteral am Gürtel.
  rf_uid: d29f717a-1565-4188-9b25-b97905180f1e
  rf_appearance_sha: 3abc9519023eba2980b8fa87f82b045a7f3aeb4989328f08bf8cc1139569ff0d
- source: Giseler
  target: Giseler
  aliases: []
  type: person
  status: draft
  note: Straßburger Gläubiger mit Narbe im Gesicht.
  visual: Mann, 45 Jahre, hager und sehnig. Scharfe Hakennase, zusammengekniffene
    Augen, dünnes rötlich-graues Haar, knochige Finger. Schlichte Kaufmannskleidung
    aus gediegenem Wollstoff, Lederbeutel am Gürtel
  rf_uid: f881e7c9-4b9e-41f3-9ee1-8e7a78c40e0e
  rf_appearance_sha: 36341f158167d4d0ce4174eaef13309de978f92f4d1855d3a57a6797c0692214
- source: Strassburg
  target: Strassburg
  aliases:
  - Straßburg
  type: place
  status: draft
  note: Hauptstadt des Rheintals, Schindentor in römischen Ziegelmauern, Salzlagerhäuser
    und Bucht der Ill.
- source: Ill
  target: Ill
  aliases: []
  type: place
  status: draft
  note: Fluss, an dessen ruhiger Schleife die Umschlagplätze der Fuhrleute liegen.
- source: Zaberner Steige
  target: Zaberner Steige
  aliases: []
  type: place
  status: draft
  note: Passweg von Straßburg nach Lothringen, über den der Transport läuft.
- source: Verdun
  target: Verdun
  aliases: []
  type: place
  status: draft
  note: Ziel des Geleits und Schauplatz des Grafengerichts.
- source: Marsal
  target: Marsal
  aliases: []
  type: place
  status: draft
  note: Ort an der Maas, Schauplatz des Bündnisses der Fuhrleute.
- source: Berengar
  target: Berengar
  aliases: []
  type: person
  status: draft
  rf_uid: 0846c193-bdbf-45c1-97ea-b9b0bbf00360
  rf_appearance_sha: 7f3851db835f1cf0be27757b6365e79cef4920026e9063401d23514e49228f39
  note: 'RomanForge-Rolle: Aldas gefallener Mann, dessen geheime Abmachung die Handlung
    auslöst'
  visual: Mann, 38 Jahre, kräftig und breitschultrig. Sonnengebräuntes Gesicht, dichter
    dunkler Vollbart, ruhige dunkle Augen, vernarbte Fuhrmannshände. Derber Fuhrmannsmantel
    aus Loden.
- source: Berto
  target: Berto
  visual_label: Berto der Sohn
  aliases:
  - Sohn Berto
  - Sohn Bertos
  type: person
  status: draft
