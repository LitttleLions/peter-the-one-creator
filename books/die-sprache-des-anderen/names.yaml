  rf_appearance_sha: 2efb36e256a389749b08fb48751001dc6938d3251bb7723d04199d55d02a067e
  note: 'RomanForge-Rolle: Aldas Sohn, dessen Zukunft und Freiheit auf dem Spiel stehen'
  visual: Junge, 9 Jahre, schmal und hochaufgeschossen. Widerspenstiger brauner Haarschopf,
    große dunkle Augen, kantiges Kinn. Schlichter, ungebleichter Wollkittel.
- source: Gerwin
  target: Gerwin
  aliases: []
  type: person
  status: draft
  rf_uid: 6804c1cd-bfb1-48ed-bae1-3f8defb36f84
  rf_appearance_sha: 9fca46a5b1c733b94cb489ec5e414b402d9e7d9648dba0aca84be3185763606f
  note: 'RomanForge-Rolle: Aldas jüngerer Bruder, dessen frühere Schuld die Familie
    ins Verderben stürzte'
  visual: Mann, 25 Jahre, mittelgroß, abgemagert und hohlwangig. Dunkelblondes, zerzaustes
    Haar, ungepflegter Bart, flache Narbe über der Augenbraue, gehetzter Blick. Verschlissene,
    schmutzige Knechtskleidung aus grober Wolle und Leder.
- source: Ines
  target: Ines
  aliases: []
  type: person
  status: draft
