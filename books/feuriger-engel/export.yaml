book:
  title: "Der feurige Engel"
  subtitle: "Ein historischer Roman von Glaubenswahn, Leidenschaft und Dämonie in neuer deutscher Ausgabe"
  author: "Walerij Brjussow"
  translator: "Motivatier Classics"
