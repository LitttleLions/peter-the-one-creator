id: geheime-geschichte-mongolen
title: Die Geheime Geschichte der Mongolen
subtitle: Eine mongolische Chronik des 13. Jahrhunderts
author: Anonym
source_lang: ja
target_lang: de
ruleset_path: ''
ruleset_apply: false
style_mode: stil-01-original
source_path: source/001.xhtml
work_dir: work
exports_dir: exports
status_file: status/status.json
log_dir: status/logs
styles_dir: styles
assets_dir: assets
names_file: names.yaml
illustration_setting: >-
  Mongol world of the 13th century, told as founding chronicle. Cinematic literary
  historical illustration, elegant realism, painterly detail. Steppe horizons, felt
  tents, horses, clan gatherings, counsel scenes, rising power. Focus on kinship,
  destiny, and political founding rather than generic battle spectacle.
  Period-grounded Mongol dress and material culture, strong atmospheric light.
  Palette: grass green, dust ochre, sky blue, felt brown, iron, bone white, night
  indigo. Clear central figure or decisive moment; historically resonant,
  emotionally intelligent.
structure:
  # §-Abschnitte der japanischen Edition als echte Arbeitseinheiten
  # (scene-NN.md), nicht als ein Kapitel-Monolith mit Zeichen-Chunking.
  mode: scenes
  label: Abschnitte
  groups:
  - id: joron
    label: Einleitung
    chapters: [0]
  - id: volume-1
    label: Erstes Buch
    chapters: [1]
  - id: volume-2
    label: Zweites Buch
    chapters: [2]
  - id: volume-3
    label: Drittes Buch
    chapters: [3]
  - id: volume-4
    label: Viertes Buch
    chapters: [4]
  - id: volume-5
    label: Fuenftes Buch
    chapters: [5]
  - id: volume-6
    label: Sechstes Buch
    chapters: [6]
  - id: volume-7
    label: Siebtes Buch
    chapters: [7]
  - id: volume-8
    label: Achtes Buch
    chapters: [8]
  - id: volume-9
    label: Neuntes Buch
    chapters: [9]
  - id: volume-10
    label: Zehntes Buch
    chapters: [10]
  - id: volume-11
