book:
  title: Die Wellenläuferin
  subtitle: Ein phantastischer Seenroman über Sehnsucht, Geheimnis und das Unerreichbare
  author: Alexander Stepanowitsch Grin
  translator: Motivatier Classics
  translator_label: Übersetzung und editorische Einrichtung
  language: de-DE
  publisher: Motivatier Hermann Stiftung
