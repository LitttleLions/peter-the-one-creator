id: kuprin-moloch
title: Der Moloch
author: Alexander Iwanowitsch Kuprin
source_path: source/Kuprin - Der Moloch - ru.html
source_lang: ru
target_lang: de
ruleset_path: ''
ruleset_apply: false
style_mode: stil-01-original
work_dir: work
exports_dir: exports
status_file: status/status.json
log_dir: status/logs
styles_dir: styles
assets_dir: assets
