book:
  title: Der Moloch
  subtitle: Ein Industrieroman aus dem Donezbecken über Macht, Gewissen und Verblendung
  author: Alexander Iwanowitsch Kuprin
  translator: Motivatier Classics
  translator_label: Übersetzung und editorische Einrichtung
