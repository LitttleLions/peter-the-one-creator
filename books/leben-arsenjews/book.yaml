id: leben-arsenjews
title: Das Leben Arsenjews
author: Iwan Bunin
source_path: source/Bunin - Das Leben Arsenjews - ru.rtf
source_lang: ru
target_lang: de
ruleset_path: ''
ruleset_apply: false
style_mode: stil-02-poetisch
work_dir: work
exports_dir: exports
status_file: status/status.json
log_dir: status/logs
styles_dir: styles
assets_dir: assets
names_file: names.yaml
illustration_setting: >-
  High-quality full-bleed chapter illustration for Ivan Bunin’s The Life of Arseniev:
  one continuous painterly scene of a single quiet remembered moment, with one clear
  central figure or central situation filling the frame. Late 19th-century provincial
  central Russia: manor estates, endless grain fields, birch and garden light, wide skies,
  quiet rivers, country roads, and small provincial towns. Style: poetic memory realism,
  soft atmospheric light, muted elegant palette, gentle painterly texture, restrained
  emotion, Russian impressionist landscape influence, premium modern classics aesthetic.
  Prefer landscape and remembered atmosphere. When an adult figure appears, it is always
  the same narrator Arseniev: slender Russian man about 35–45, dark wavy hair, clean-shaven
  or light stubble, dark frock coat, often a quiet Rückenfigur looking into fields, river
  light, or a manor yard. When the text remembers childhood, show that child’s solitude
  among fields, sky, manor yard, or first town glimpses — a small boy in simple period
  clothes. Elegant negative space, soft focus in secondary areas, calm readable composition.
structure:
  mode: chapter_as_scene
  label: Kapitel als Szenen
  groups:
  - id: buch-1
    label: Erstes Buch
    from: '001'
    to: '021'
  - id: buch-2
    label: Zweites Buch
    from: '022'
    to: '040'
  - id: buch-3
    label: Drittes Buch
    from: '041'
    to: '053'
  - id: buch-4
    label: Viertes Buch
    from: '054'
    to: '074'
  - id: buch-5
    label: Fünftes Buch
    from: '075'
    to: '104'
display:
  chapters:
    format: words_de
    suffix: " Kapitel"
    align: center
    include_source_title: false
  scenes:
    show: false
naming_convention:
  style: Deutsche Transliteration russischer Namen nach Duden-Üblichkeit.
  example:
  - Иван Бунин -> Iwan Bunin
  - Арсеньев -> Arsenjew
  - Лика -> Lika
higgsfield:
  model: text2image_soul_v2
  aspect_ratio: "3:4"
  quality: 1.5k
  image_processing:
