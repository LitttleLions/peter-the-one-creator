    jpeg_quality: 60
    max_width: 1600
    max_height: 2400
notes: >-
  Buchpaket fuer Iwan Bunin, Das Leben Arsenjews. RTF-Quelle aus dem
  russischen Original. Erinnerungsroman über Kindheit, Jugend, Liebe,
  Herkunft und Verlust einer vergangenen Welt.
ai:
