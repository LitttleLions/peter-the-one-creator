original_quotes:
  - chapter: '086'
    scene: 1
    text: 'Мы томимся желанием, мы алчем забот — // А в душе лишь тревога пустая… // Что же ищем, куда мы спешим? // Мы и сами того не знаем!» — А. С. Пушкин'
  - chapter: '096'
    scene: 1
    text: 'И вдруг яр среди ровной дороги – обрыв в глубину и вниз…'
