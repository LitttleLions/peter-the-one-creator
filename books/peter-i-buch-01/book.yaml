id: peter-i-buch-01
title: Peter der Erste
author: Alexei Tolstoi
source_path: source/Peter I - Buch 01 - royallib.ru.doc
source_lang: ru
target_lang: de
ruleset_path: logic/peter the one - Regeln 001.txt
ruleset_apply: true
style_mode: stil-03-branderson
work_dir: work
exports_dir: exports
status_file: status/status.json
log_dir: status/logs
styles_dir: styles
assets_dir: assets
names_file: names.yaml
structure:
  mode: scenes
  label: Kapitel mit Szenen
  groups:
  - id: erstes-buch
    label: Erstes Buch
    from: '001'
    to: '007'
  - id: zweites-buch
    label: Zweites Buch
    from: '008'
    to: '012'
  - id: drittes-buch
    label: Drittes Buch
    from: '013'
    to: '018'
display:
  chapters:
    format: words_de
    suffix: " Kapitel"
    align: center
    include_source_title: false
  scenes:
    show: true
    format: number
    align: center
    page_break: false
    separator: ""
naming_convention:
  style: russische Transliteration (Duden-Standard)
  example:
  - Пётр -> Peter
  - Иван -> Iwan
  - Софья -> Sofja
  - Алексей -> Alexei
  - Толстой -> Tolstoi
higgsfield:
  model: text2image_soul_v2
  aspect_ratio: "3:4"
  quality: 2k
  moodboard:
    name: Buch Peter der Erste
    custom_reference_id: 8b79a5c6-5539-4257-9b42-537d82259bc4
    source: "higgsfield generate list --image --size 100 --json"
    note: >-
      CLI akzeptiert diese UUID als --custom_reference_id. Bei den ersten
      Test-Jobs meldete Higgsfield in der Antwort trotzdem style_name:
      General; vor produktiven Serienlaeufen erneut pruefen.
notes: 'Roman in 3 Bänden von Alexei Tolstoi. Russisches Original,

  417 Seiten, ~201.000 Wörter. Buch 1 in dieser Datei.

  '
ai:
  provider: openrouter
  model: deepseek/deepseek-v4-pro
  granularity: scene
  max_tokens_per_scene: 10000
