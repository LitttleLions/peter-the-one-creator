    Originaltitel: Пётр Первый
    Originalautor: Alexei Nikolajewitsch Tolstoi (1883–1945)

    Diese Ausgabe ist eine neue deutsche Übersetzung aus dem russischen Original. Die Übersetzung und editorische Einrichtung wurden KI-gestützt erstellt und redaktionell geprüft.

    Die kurzen Vorspänne vor den Kapiteln stammen nicht aus dem russischen Original. Sie wurden für diese Ausgabe ergänzt, um historische, atmosphärische und erzählerische Orientierung zu geben.

