  description: >-
    Bolesław Prus' historischer Roman Der Pharao erzählt vom Machtkampf
    zwischen jungem Königtum, Priesterschaft, Staatsräson und persönlichem
    Ehrgeiz im alten Ägypten. Diese neue deutsche Ausgabe folgt dem
    polnischen Original Faraon und macht den großen polnischen Klassiker in
    zeitgemäßer deutscher Sprache zugänglich.
  summary: |
    Der Pharao führt in ein Ägypten, das zugleich fern und erstaunlich
    gegenwärtig wirkt: ein Reich aus Tempeln, Palästen, Heeren, Abgaben,
    Ritualen und unsichtbaren Machtordnungen. Im Mittelpunkt steht ein junger
    Herrscher, der die Last der Krone nicht nur als Würde, sondern als Kampf
    erfährt. Was als persönliche Bewährungsprobe beginnt, weitet sich zu einer
    Erzählung über Staat, Religion, Wissen, Geld und politische Illusion.

    Bolesław Prus entwirft keine bloße Kulisse des Altertums. Sein Ägypten ist
    ein geistiger und gesellschaftlicher Raum, in dem die Mechanismen von
    Herrschaft sichtbar werden: die Macht der Archive und der Priester, die
    Verwundbarkeit des Militärs, die Abhängigkeit der Politik von Getreide,
    Wasser, Steuern und Deutungshoheit. Die Figuren bewegen sich zwischen
    Leidenschaft und Kalkül, zwischen Ehrgeiz und Unwissen, zwischen der
    Sehnsucht nach Erneuerung und der zähen Trägheit alter Institutionen.

    Der Roman gehört zu den ungewöhnlichsten historischen Werken des
    europäischen Realismus. Er blickt auf eine versunkene Welt, um Grundfragen
    moderner Politik zu stellen: Wer regiert wirklich? Was vermag ein
    einzelner Wille gegen eine eingespielte Ordnung? Und wie gefährlich wird
    Macht, wenn sie sich selbst nicht versteht?
  author_bio: |
    Bolesław Prus war das literarische Pseudonym von Aleksander Głowacki,
    geboren 1847 in Hrubieszów, gestorben 1912 in Warschau. Er zählt zu den
    bedeutendsten polnischen Erzählern des 19. Jahrhunderts und gilt als eine
    zentrale Gestalt des polnischen Realismus. Neben seiner Arbeit als
    Romancier war er Journalist, Chronist und genauer Beobachter der sozialen,
    politischen und geistigen Spannungen seiner Zeit.

    Zu seinen wichtigsten Werken gehören Die Puppe, Die Emanzipierten, Der
    Außenposten und Faraon. Prus verband psychologische Genauigkeit mit
    gesellschaftlicher Analyse und einer erzählerischen Nüchternheit, die nie
    bloß trocken bleibt. Seine Romane interessieren sich für Menschen in
    Systemen: für Besitz, Bildung, Macht, Abhängigkeit, Fortschritt und
    Selbsttäuschung.

    Faraon erschien in den 1890er Jahren und nimmt innerhalb seines Werkes
    eine besondere Stellung ein. Anders als seine großen Gegenwartsromane
    verlegt Prus die Handlung in das alte Ägypten, ohne sich in historischer
    Dekoration zu verlieren. Der Roman nutzt die Antike als Spiegel politischer
    und sozialer Strukturen und wurde dadurch zu einem der markantesten
    historischen Romane der polnischen Literatur.
