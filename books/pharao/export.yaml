book:
  title: Der Pharao
  subtitle: Historischer Roman aus dem alten Aegypten
  author: Boleslaw Prus
  translator: Motivatier Classics
  translator_label: Deutsche Ausgabe
  language: de-DE
  publisher: ''
  rights: ''
  original_title: Faraon
  source_title: 'The Pharaoh and the Priest: An Historical Novel of Ancient Egypt'
  source_author: Boleslaw Prus
  source_translator: Jeremiah Curtin
  description: >-
    Boleslaw Prus' historischer Roman fuehrt in das alte Aegypten und erzaehlt
    vom Konflikt zwischen weltlicher Herrschaft, Priestermacht, Staatskunst und
    persoenlichem Ehrgeiz. Die deutsche Ausgabe entsteht aus der englischen
    Gutenberg-Vorlage von Jeremiah Curtin.
  summary: >-
    Der Pharao folgt dem jungen Ramses in einer Welt aus Tempeln, Hoefen,
    Armeen, Intrigen und religiöser Macht. Zwischen politischem Willen,
    persoenlicher Leidenschaft und der ueberlegenen Ordnung der Priesterschaft
    entfaltet sich ein historischer Roman ueber Herrschaft, Wissen und den
    Preis von Macht.
  author_bio: >-
    Boleslaw Prus war ein polnischer Schriftsteller des 19. Jahrhunderts und
    gehoert zu den wichtigen Stimmen des polnischen Realismus. Mit Faraon
    schrieb er einen breit angelegten historischen Roman, der das alte
    Aegypten als Buehne fuer zeitlose Fragen nach Staat, Religion, Macht und
    gesellschaftlicher Ordnung nutzt.
  title_page_extra:
  - 'Originaltitel: Faraon'
  - 'Englische Vorlage: The Pharaoh and the Priest, uebersetzt von Jeremiah Curtin'
  - 'Master-Quelle: Project Gutenberg Plaintext #23646'
  - 'Referenzquelle: Project Gutenberg EPUB #35499'
