  description: >-
    Pissemskis Gesellschaftsroman um einen ehrgeizigen Beamten zwischen
    Provinz, Petersburg, Geldheirat und Gewissen. Neue deutsche Ausgabe
    nach dem russischen Original, KI-gestützt übersetzt und redaktionell
    geprüft.
  summary: |
    „Tausend Seelen“ folgt Jakow Kalinowitsch, der aus bescheidenen
    Verhältnissen in die Beamtenlaufbahn drängt: zwischen Provinzstadt,
    Gönnern, Schuldnern und der Familie Godnew sucht er Aufstieg um jeden
    Preis. Seine Werbung um Nastjenka und sein Pakt mit Geld und Einfluss
    werden zum Prüfstein seines Charakters.

    Pissemski schildert Karriere als Tauschgeschäft: Bildung und Fleiß
    gegen Protektion, Liebe gegen Mitgift, Recht gegen Gefälligkeit.
    Figuren wie Belawin, der Fürst oder Kapitän Rosa stehen für ein
    System, das Loyalität kauft und Gewissen erschöpft. Im Zentrum bleibt
    Kalinowitschs Frage, was ein Mensch wert ist, wenn Seelen zu
    Vermögenswerten werden.

    Der Roman von 1858 gehört zu den wirkmächtigsten russischen
    Gesellschaftsromanen vor den großen Würfen der 1860er Jahre und nahm
    Themen von Ehrgeiz, Korruption und innerer Umkehr vorweg, die später
    das Zeitalter prägen sollten.
  author_bio: |
    Alexei Feofilaktowitsch Pissemski (1821–1881) war ein russischer
    Erzähler und Dramatiker des Realismus, berühmt für nüchterne
    Gesellschaftsbeobachtung und Bühnenwirksamkeit. Nach Beamtenjahren in
    Kostroma und Petersburg wurde er mit Bauern- und Beamtenerzählungen
    bekannt.

    Zu seinen wichtigsten Werken zählen „Tausend Seelen“ (1858), „Die
    Wirren der Zeit“ und das Drama „Ein bitteres Schicksal“. Pissemski
    galt Zeitgenossen als scharfer Sittenschilderer der Provinz und der
    Bürokratie. Sein Werk steht zwischen Gogol-Nachfolge und dem
    psychologischen Realismus der folgenden Generation.
